[package]
name = "smidr"
version = "1.3.1"
edition = "2024"
authors = ["Max-Mend"]
description = "Smidr is a cargo-inspired build tool for C/C++ projects, meant to bridge dependencies across different build systems into a single build."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Max-Mend/smidr"
readme = "README.md"
keywords = [
    "c",
    "cpp",
    "cli",
    "toolchain",
    "build-system",
]
categories = ["development-tools", "command-line-utilities"]

[package.metadata.deb]
maintainer = "Max-Mend"
copyright = "2026, Max-Mend"
license-file = ["LICENSE-APACHE", "0"]
extended-description = """\
Smidr is a cargo-inspired build tool for C/C++ projects, meant to \
bridge dependencies across different build systems into a single build."""
depends = "$auto, git, pkg-config"
section = "devel"
priority = "optional"
assets = [
    ["target/release/smidr", "usr/bin/", "755"],
    ["LICENSE-MIT", "usr/share/doc/smidr/", "644"],
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[dependencies]
ariadne = "0.6.0"
clap = { version = "4.6.6", features = ["derive"] }
semver = "1.0.28"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.20"
toml = "0.8"
